# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven


name: Java Support Matrix

on:
  push:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # test against supported Java version:
        java: [ '25', '26', '27' ]

    # Service containers to run with `runner-job`
    services:
      activemq:
        image: apache/artemis:latest
        ports:
          - 61616:61616
        env:
          AMQ_USER: admin
          AMQ_PASSWORD: admin
          AMQ_EXTRA_ARGS: --relax-jolokia
          ARTEMIS_USER: admin
          ARTEMIS_PASSWORD: admin

      postgres:
        # Docker Hub image
        image: postgres
        # setup default ports
        ports:
          # Opens tcp port 5432 on the host and service container
          - 5432:5432
        # setup default user for testing
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_USER: postgres
      minio:
        image: lazybit/minio
        ports:
          - 8110:9000
          - 8111:9001
        env:
          MINIO_ROOT_USER: minioadmin      # Admin Access Key
          MINIO_ROOT_PASSWORD: minioadmin


    steps:
      - name: Start Redpanda with Schema Registry
        run: |
          docker run -d --name redpanda \
            -p 9092:9092 \
            -p 8081:8081 \
            --health-cmd="rpk cluster info" \
            --health-interval=5s \
            --health-retries=20 \
            redpandadata/redpanda:latest \
            redpanda start \
              --overprovisioned \
              --smp 1 \
              --memory 1G \
              --reserve-memory 0M \
              --node-id 0 \
              --kafka-addr PLAINTEXT://0.0.0.0:9092 \
              --advertise-kafka-addr PLAINTEXT://localhost:9092 \
              --schema-registry-addr 0.0.0.0:8081

      - name: Wait for Redpanda to be healthy
        run: |
          echo "Waiting for Redpanda to be healthy..."
          for i in {1..30}; do  # ~60s Timeout
            if [ "$(docker inspect -f '{{.State.Health.Status}}' redpanda 2>/dev/null)" = "healthy" ]; then
              echo "✅ Redpanda is healthy!"
              exit 0
            fi
            echo "⏳ Still waiting..."
            sleep 2
          done
          echo "❌ Timeout: Redpanda did not become healthy in time"
          exit 1
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Maven build
        run: mvn '-Dmaven.compiler.release=${{ matrix.java }}' -B clean install
