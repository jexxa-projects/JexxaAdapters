# This workflow creates a new release that can be triggered directly from GitHub.
name: New Release

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Service containers to run with `runner-job`
    services: # Start services activeMQ and Postgres-DB

      activemq:
        image: apache/artemis:latest
        ports:
          - 61616:61616
        env:
          AMQ_EXTRA_ARGS: --relax-jolokia
          ARTEMIS_USER: admin
          ARTEMIS_PASSWORD: admin

      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_USER: postgres

      silo:
        image: pgsty/silo:latest
        ports:
          - 8110:9000
          - 8111:9001
        options: --entrypoint /bin/sh pgsty/silo:latest -c "silo server /data"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin

    steps:
      - name: Start Redpanda with Schema Registry
        run: |
          docker run -d --name redpanda \
            -p 9092:9092 \
            -p 8081:8081 \
            --health-cmd="rpk cluster info" \
            --health-interval=5s \
            --health-retries=20 \
            redpandadata/redpanda:latest \
            redpanda start \
              --overprovisioned \
              --smp 1 \
              --memory 1G \
              --reserve-memory 0M \
              --node-id 0 \
              --kafka-addr PLAINTEXT://0.0.0.0:9092 \
              --advertise-kafka-addr PLAINTEXT://localhost:9092 \
              --schema-registry-addr 0.0.0.0:8081

      - name: Wait for Redpanda to be healthy
        run: |
          echo "Waiting for Redpanda to be healthy..."
          for i in {1..30}; do  # ~60s Timeout
            if [ "$(docker inspect -f '{{.State.Health.Status}}' redpanda 2>/dev/null)" = "healthy" ]; then
              echo "✅ Redpanda is healthy!"
              exit 0
            fi
            echo "⏳ Still waiting..."
            sleep 2
          done
          echo "❌ Timeout: Redpanda did not become healthy in time"
          exit 1      # Login into GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Checkout repository
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'adopt'
          server-id: github
          cache: maven
      # configure git for building a new release
      - name: Configure Git user
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      # Build the new release
      - name: Create new release
        run: mvn -B -P integrationTests release:prepare release:perform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
