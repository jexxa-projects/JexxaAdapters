# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Maven Test Build

on:
  push:
  workflow_dispatch:

jobs:
  maven_build:
    name: Maven-Build (Linux)
    runs-on: ubuntu-latest

    # Service containers to run with `runner-job`
    services:
      activemq:
        image: apache/artemis:latest
        ports:
          - 61616:61616
        env:
          AMQ_EXTRA_ARGS: --relax-jolokia
          ARTEMIS_USER: admin
          ARTEMIS_PASSWORD: admin

      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: admin
          POSTGRES_USER: postgres

      silo:
        image: pgsty/silo:latest
        ports:
          - 8110:9000
          - 8111:9001
        options: --entrypoint /bin/sh pgsty/silo:latest -c "silo server /data"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin


    steps:
      - name: Start Redpanda with Schema Registry
        run: |
          docker run -d --name redpanda \
            -p 9092:9092 \
            -p 8081:8081 \
            --health-cmd="rpk cluster info" \
            --health-interval=5s \
            --health-retries=20 \
            redpandadata/redpanda:latest \
            redpanda start \
              --overprovisioned \
              --smp 1 \
              --memory 1G \
              --reserve-memory 0M \
              --node-id 0 \
              --kafka-addr PLAINTEXT://0.0.0.0:9092 \
              --advertise-kafka-addr PLAINTEXT://localhost:9092 \
              --schema-registry-addr 0.0.0.0:8081

      - name: Wait for Redpanda to be healthy
        run: |
          echo "Waiting for Redpanda to be healthy..."
          for i in {1..30}; do  # ~60s Timeout
            if [ "$(docker inspect -f '{{.State.Health.Status}}' redpanda 2>/dev/null)" = "healthy" ]; then
              echo "✅ Redpanda is healthy!"
              exit 0
            fi
            echo "⏳ Still waiting..."
            sleep 2
          done
          echo "❌ Timeout: Redpanda did not become healthy in time"
          exit 1
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Build with Maven
        run: mvn -B install --file pom.xml
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
